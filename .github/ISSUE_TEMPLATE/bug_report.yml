name: Bug report
description: Что-то не работает: движок, установка, API, плагин ZCode
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за отчёт. Заполните поля ниже — это сильно ускорит разбор.
        Критические уязвимости не пишите в issues: см. SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: Что произошло
      description: Ожидаемое и фактическое поведение, точные команды.
      placeholder: |
        Ожидал: ...
        Получил: ...
        Команда: ./scripts/laya.sh start
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Диагностика
      description: |
        Вывод `/info` (или `curl 127.0.0.1:8095/info`), ошибки из лога
        (`logs/laya-server.log`), вывод self-test.
      render: text
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Среда
      description: ОС и версия, CPU/GPU (+ драйвер), способ запуска (скрипт/Docker), ветка/тег
      placeholder: "Windows 11 23H2, RTX 3060 драйвер 566, ./scripts/install.sh, v1.0.0"
    validations:
      required: true
  - type: input
    id: checkpoint
    attributes:
      label: Чекпоинт
      description: Значение `checkpoint.sha256` из `/info` (короткий id тоже подойдёт)
      placeholder: "multilingual-fp16-0b095e005a4c"
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Проверено
      options:
        - label: Веса скачаны скриптом и SHA-256 совпал (`fetch-model.*`)
        - label: Сервис отвечает на `/health` и `/ready`
        - label: Проблема воспроизводится на последнем коммите/релизе
